language: node_js
node_js:
  - "22.22.3"

branches:
  only:
    - main

before_install:
  - eval "$(ssh-agent -s)"
  # Decode Base64 key and add to SSH agent
  - echo "$SSH_KEY_B64" | base64 --decode | ssh-add -
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - ssh-keyscan -p ${SSH_PORT:-22} -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null

script:
  - ssh -p ${SSH_PORT:-22} $SSH_USER@$SSH_HOST 'bash -s' < ./deploy.sh