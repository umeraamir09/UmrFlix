language: node_js
node_js:
  - "22.22.3"

branches:
  only:
    - main

env:
  global:
    - OPENCODE_BASE_URL="https://api.opencode.zen/v1"

before_install:
  # Install Python dependencies for the AI PR Reviewer
  - pip3 install --quiet openai requests
  # Setup SSH key only when preparing to deploy on main branch push
  - |
    if [ "$TRAVIS_PULL_REQUEST" = "false" ]; then
      eval "$(ssh-agent -s)"
      echo "$SSH_KEY_B64" | base64 --decode | ssh-add -
      mkdir -p ~/.ssh
      chmod 700 ~/.ssh
      ssh-keyscan -p ${SSH_PORT:-22} -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null
    fi

# Note: Travis runs 'npm ci' automatically in the install phase, so 'before_script: npm ci' can be removed.

script:
  # 1. Run AI PR Review on Pull Requests
  - |
    if [ "$TRAVIS_PULL_REQUEST" != "false" ]; then
      python3 scripts/pr_reviewer.py
    fi
  # 2. Run Quality Checks, Tests, and Build
  - npm run lint
  - npm run test:party
  - npm run test:discovery
  - npm run build

after_success:
  # Deploy only on pushed commits to main (never on PR builds)
  - |
    if [ "$TRAVIS_BRANCH" = "main" ] && [ "$TRAVIS_PULL_REQUEST" = "false" ]; then
      ssh -p ${SSH_PORT:-22} $SSH_USER@$SSH_HOST 'bash -s' < ./deploy.sh
    fi
