networks:
  media_internal:
    driver: bridge
  # --- Uncomment this if using Nginx Proxy Manager (NPM) to expose services to the internet ---
  # npm_proxy:
  #   external: true
  #   name: ${NPM_NETWORK_NAME}

services:
  # ---------------------------------------------------------------
  # QBITTORRENT - torrent client
  # ---------------------------------------------------------------
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: 8080
    volumes:
      - ./config/qbittorrent:/config
      - ${DATA_ROOT}/torrents:/data/torrents
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
    networks:
      - media_internal
      # - npm_proxy

  # ---------------------------------------------------------------
  # JELLYFIN - media server
  # ---------------------------------------------------------------
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./config/jellyfin:/config
      - ${DATA_ROOT}/media:/data/media
    ports:
      - "8096:8096"
    restart: unless-stopped
    networks:
      - media_internal
      # - npm_proxy

  # ---------------------------------------------------------------
  # SONARR - TV show automation
  # ---------------------------------------------------------------
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./config/sonarr:/config
      - ${DATA_ROOT}/media/tv:/data/media/tv
      - ${DATA_ROOT}/torrents:/data/torrents
    ports:
      - "8989:8989"
    restart: unless-stopped
    networks:
      - media_internal
      # - npm_proxy

  # ---------------------------------------------------------------
  # RADARR - Movie automation
  # ---------------------------------------------------------------
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./config/radarr:/config
      - ${DATA_ROOT}/media/movies:/data/media/movies
      - ${DATA_ROOT}/torrents:/data/torrents
    ports:
      - "7878:7878"
    restart: unless-stopped
    networks:
      - media_internal
      # - npm_proxy

  # ---------------------------------------------------------------
  # PROWLARR - indexer manager for Sonarr/Radarr
  # ---------------------------------------------------------------
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    networks:
      - media_internal
      # - npm_proxy

  # ---------------------------------------------------------------
  # SEERR - request management (docs.seerr.dev, the unified successor
  # to Jellyseerr and Overseerr). Note: unlike the LinuxServer images
  # above, this one does NOT use PUID/PGID - it always runs as the
  # built-in `node` user (UID 1000), so the host config folder needs
  # to be chowned to 1000:1000 manually (see setup guide).
  # ---------------------------------------------------------------
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    volumes:
      - ./config/seerr:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5055/api/v1/settings/public"]
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    networks:
      - media_internal
      # - npm_proxy

  # ---------------------------------------------------------------
  # FLARESOLVERR - Cloudflare bypass proxy
  # ---------------------------------------------------------------
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE: ${LOG_FILE:-none}
      LOG_HTML: ${LOG_HTML:-false}
      CAPTCHA_SOLVER: ${CAPTCHA_SOLVER:-none}
      TZ: ${TZ}
    volumes:
      - ./config/flaresolverr:/config
    ports:
      - "8191:8191"
    restart: unless-stopped
    networks:
      - media_internal
      # - npm_proxy

  # ---------------------------------------------------------------
  # POSTGRES - database for UmrFlix (watchlist, requests,
  # notifications, sessions, party room state). Credentials come
  # from .env. Not publicly exposed: bound to localhost for
  # optional host access, otherwise reachable via media_internal.
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      - ./config/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      start_period: 10s
      timeout: 5s
      interval: 10s
      retries: 5
    networks:
      - media_internal
      # - npm_proxy
